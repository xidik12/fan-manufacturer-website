<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Dongil International — corporate website</title>
  <desc id="desc">Bilingual static website for Dongil International, a Phnom Penh distributor of Korean-quality ventilation fans and blowers. Established 1998, 28-plus years, 200-plus models, served across Southeast Asia. An axial fan illustration sits on the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0d1d38"/>
      <stop offset="1" stop-color="#241021"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#274a86"/>
      <stop offset="1" stop-color="#12233f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A4123F"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#22334f" stroke-width="1"/>

  <!-- Title block -->
  <g transform="translate(64 60)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14"
          letter-spacing="3" fill="#7c96c4">STATIC WEBSITE · BILINGUAL EN / KR · GITHUB PAGES</text>

    <text y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="60" font-weight="800" fill="#f2f6fc">Dongil International</text>

    <rect x="2" y="86" width="132" height="5" rx="2.5" fill="url(#rule)"/>

    <text y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="500" fill="#c6d4e8">Corporate site for a Korean-quality ventilation</text>
    <text y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="500" fill="#c6d4e8">&amp; fan-manufacturing distributor.</text>

    <!-- Stat chips -->
    <g transform="translate(0 200)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g>
        <text font-size="30" font-weight="800" fill="#f2f6fc">28+</text>
        <text y="22" font-size="12.5" fill="#8ea3c0">Years · since 1998</text>
      </g>
      <g transform="translate(178 0)">
        <text font-size="30" font-weight="800" fill="#f2f6fc">200+</text>
        <text y="22" font-size="12.5" fill="#8ea3c0">Fan models</text>
      </g>
      <g transform="translate(320 0)">
        <text font-size="30" font-weight="800" fill="#f2f6fc">15+</text>
        <text y="22" font-size="12.5" fill="#8ea3c0">Product lines</text>
      </g>
      <g transform="translate(470 0)">
        <text font-size="30" font-weight="800" fill="#e0728f">KR</text>
        <text y="22" font-size="12.5" fill="#8ea3c0">Dongil Machinery</text>
      </g>
    </g>
  </g>

  <!-- Axial fan illustration (project-native motif) -->
  <g transform="translate(985 180)">
    <!-- airflow arcs -->
    <g fill="none" stroke="#3b6bd4" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
      <path d="M 150 -70 q 46 70 0 140"/>
      <path d="M 176 -92 q 66 92 0 184"/>
    </g>
    <!-- housing ring -->
    <circle r="140" fill="#0c1c34"/>
    <circle r="140" fill="none" stroke="#33507e" stroke-width="3"/>
    <circle r="128" fill="none" stroke="#1c3157" stroke-width="1.5"/>
    <!-- blades -->
    <g>
      <path id="fanblade" d="M 24 -9 C 60 -50 118 -46 130 2 C 100 -8 62 -3 40 15 C 32 6 27 -2 24 -9 Z" fill="url(#blade)" stroke="#4a6ea8" stroke-width="1.5"/>
      <use href="#fanblade" transform="rotate(60)"/>
      <use href="#fanblade" transform="rotate(120)"/>
      <use href="#fanblade" transform="rotate(180)"/>
      <use href="#fanblade" transform="rotate(240)"/>
      <use href="#fanblade" transform="rotate(300)"/>
    </g>
    <!-- hub -->
    <circle r="30" fill="#16294a" stroke="#4a6ea8" stroke-width="2"/>
    <circle r="9" fill="#A4123F"/>
    <!-- corner mount bolts -->
    <g fill="#26406a">
      <circle cx="-118" cy="-118" r="6"/>
      <circle cx="118" cy="-118" r="6"/>
      <circle cx="-118" cy="118" r="6"/>
      <circle cx="118" cy="118" r="6"/>
    </g>
  </g>
</svg>
